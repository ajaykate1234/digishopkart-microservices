server:
  port: 8088

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: customer
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/v1/customers,/api/v1/customers/**,/api/v1/customerAddress,/api/v1/customerAddress/**
            - id: product
              uri: http://127.0.0.1:8083
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/catalog/**,/api/v1/variant,/api/v1/variant/**
            - id: discount
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/api/v1/discounts,/api/v1/discounts/**
            - id: order
              uri: http://127.0.0.1:8085
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**
