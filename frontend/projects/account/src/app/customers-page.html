<section class="page-head">
  <div>
    <p class="eyebrow">Account microfrontend</p>
    <h1>Customers</h1>
  </div>
  <button type="button" class="button ghost" (click)="load()">Refresh</button>
</section>
@if (error()) { <p class="banner">{{ error() }}</p> }
@if (notice()) { <p class="banner ok">{{ notice() }}</p> }
<div class="table-wrap">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Status</th><th></th></tr></thead>
    <tbody>
      @for (customer of rows(); track customer.id) {
        <tr>
          <td>{{ customer.firstName }} {{ customer.lastName }}</td>
          <td>{{ customer.email }}</td>
          <td>{{ customer.customerStatus }}</td>
          <td><button type="button" class="button ghost" (click)="toggle(customer)">{{ customer.customerStatus === 'active' ? 'Mark inactive' : 'Mark active' }}</button></td>
        </tr>
      } @empty { <tr><td colspan="4">No customers yet.</td></tr> }
    </tbody>
  </table>
</div>
