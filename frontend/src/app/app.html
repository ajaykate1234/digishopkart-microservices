<div class="store">
  <header class="mast">
    <a class="logo" routerLink="/">DigiShopKart</a>
    <form class="search" (submit)="$event.preventDefault(); search()">
      <input [value]="query()" (input)="query.set($any($event.target).value)" placeholder="Search products, brands, and categories" />
      <button class="button" type="submit">Search</button>
    </form>
    <nav>
      <a routerLink="/catalog" routerLinkActive="active">Catalog</a>
      <a routerLink="/offers" routerLinkActive="active">Offers</a>
      <a routerLink="/checkout" routerLinkActive="active">Bag ({{ cartCount() }})</a>
      @if (signedIn()) {
        <a routerLink="/account" routerLinkActive="active">Account</a>
      }
      @if (isAdmin()) {
        <a routerLink="/account/customers" routerLinkActive="active">Customers</a>
      }
      @if (signedIn()) {
        <button type="button" class="button ghost" (click)="signOut()">Sign out</button>
      } @else {
        <a class="button ghost" routerLink="/login">Sign in</a>
      }
    </nav>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
