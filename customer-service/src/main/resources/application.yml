server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:mysql://localhost:3306/digishopkart_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:digishopkart}
    password: ${DB_PASSWORD:digishopkart}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:digishopkart-local-dev-jwt-secret-key-32}
    expiration-minutes: 120
