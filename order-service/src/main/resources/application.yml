server:
  port: 8085

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/digishopkart_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:digishopkart}
    password: ${DB_PASSWORD:digishopkart}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:digishopkart-local-dev-jwt-secret-key-32}
    expiration-minutes: 120

digishopkart:
  customer-url: http://127.0.0.1:8082
  product-url: http://127.0.0.1:8083
  discount-url: http://127.0.0.1:8084
